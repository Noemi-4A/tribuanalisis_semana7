<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario 709 · Tribuanálisis</title>
<style>
:root{--wine:#7A1E3C;--rose:#B85B72;--cream:#F4F1EA;--petrol:#0E3A5A;--line:#e8d8d6}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--petrol);font-family:Arial,sans-serif}
header{height:76px;background:#fffdfa;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,54px);gap:16px}
.brand{font-family:Georgia,serif;font-size:23px;font-weight:bold;color:var(--wine)}.brand small{display:block;font:700 9px Arial;letter-spacing:2px;margin-top:4px}
main{max-width:1440px;margin:28px auto;padding:0 22px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px;flex-wrap:wrap}
h1{font:700 clamp(25px,3vw,36px) Georgia,serif;margin:0 0 7px;color:var(--petrol)}
.sub{color:#6b8498;font-size:14px;line-height:1.5}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--petrol);padding:12px 18px;border-radius:11px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--wine);border-color:var(--wine);color:white}
.frame-wrap{height:calc(100vh - 190px);min-height:620px;background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 32px rgba(50,35,40,.08)}
iframe{width:100%;height:100%;border:0;background:white}
.status{padding:18px;background:white;border:1px solid var(--line);border-radius:14px;color:#59758b}
@media(max-width:650px){header{height:auto;min-height:68px;padding:12px 16px}.brand{font-size:19px}main{padding:0 12px;margin:18px auto}.frame-wrap{height:72vh;min-height:480px}.actions{width:100%}.actions .btn{flex:1;text-align:center;padding:11px 10px}}
</style>
</head>
<body>
<header><div class="brand">Tribuanálisis<small>TRIBUTACIÓN II</small></div><a class="btn" href="/#historial">Volver al historial</a></header>
<main>
<div class="head">
 <div><h1>Formulario 709 · Vista previa</h1><div class="sub" id="caseTitle">Preparando el formulario del caso seleccionado…</div></div>
 <div class="actions">
  <a class="btn" id="openPdf" target="_blank" rel="noopener" hidden>Abrir PDF en otra pestaña ↗</a>
  <a class="btn primary" id="downloadPdf" download="Formulario_709.pdf" hidden>Descargar Formulario 709 ↓</a>
 </div>
</div>
<div class="status" id="status">Generando el Formulario 709 con los datos guardados del caso…</div>
<div class="frame-wrap" id="frameWrap" hidden><iframe id="pdfFrame" title="Vista previa del Formulario 709"></iframe></div>
</main>
<script>
const caseData={{ case_data|tojson }};
let pdfUrl=null;
const statusEl=document.getElementById('status');
const frameWrap=document.getElementById('frameWrap');
const frame=document.getElementById('pdfFrame');
const download=document.getElementById('downloadPdf');
const openPdf=document.getElementById('openPdf');
const caseTitle=document.getElementById('caseTitle');
const num=(v)=>Math.max(0,Number(v)||0);
function normalize(item){
 const stored=item.payload||{};
 const p={...stored,...(stored.inputs||{})};
 p.kind=p.kind||stored.kind||'';
 p.taxpayerName=p.taxpayerName||stored.caseName||item.case_name||'';
 p.taxpayerRuc=p.taxpayerRuc||stored.taxpayerRuc||stored.ruc||'';
 p.proFourth=p.proFourth??stored.fourthGross??stored.fourthNet??0;
 p.otherFourth=p.otherFourth??stored.otherFourth??0;
 p.fifthSalary=p.fifthSalary??stored.fifthGross??stored.fifthSalary??0;
 p.gratifications=p.gratifications??stored.gratifications??0;
 p.bonuses=p.bonuses??stored.bonuses??0;
 p.foreignNet=p.foreignNet??stored.foreignNet??0;
 p.annualTax=p.annualTax??item.annual_tax??0;
 p.balance=p.balance??item.balance??0;
 p.withholding=p.withholding??((num(stored.fourthCredits)+num(stored.fifthCredits)+num(stored.withholding)));
 p.payments=p.payments??stored.payments??0;
 p.foreignCredit=p.foreignCredit??stored.foreignCredit??0;
 p.extraDeduction=p.extraDeduction??stored.extraDeduction??0;
 p.itfDeduction=p.itfDeduction??stored.itfDeduction??p.itf??0;
 p.donationDeduction=p.donationDeduction??stored.donationDeduction??p.donations??0;
 p.taxpayerRuc=p.taxpayerRuc||'';
 p.year=Number(p.year||item.year||new Date().getFullYear());
 p.taxPeriod=p.taxPeriod||`${p.year}13`;
 p.declarationType=p.declarationType||'ORIGINAL';
 if(!p.kind){
  const label=String(item.category||'').toLowerCase();
  p.kind=/mixt|combin/.test(label)?'mixta':/quinta/.test(label)?'quinta':/extranj|exterior/.test(label)?'extranjera':'cuarta';
 }
 p.uit=p.uit|| (p.year===2025?5350:5500);
 return p;
}
async function build(){
 if(!caseData){statusEl.textContent='No se encontró el caso solicitado o no tienes permiso para verlo.';return;}
 caseTitle.textContent=`${caseData.case_name} · Ejercicio ${caseData.year}`;
 try{
  const payload=normalize(caseData);
  const response=await fetch('/api/formulario-709',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.error||`No se pudo generar el PDF (HTTP ${response.status}).`);}
  const blob=await response.blob();
  if(!blob.type.includes('pdf'))throw new Error('El servidor no devolvió un documento PDF válido.');
  pdfUrl=URL.createObjectURL(blob);
  frame.src=pdfUrl+'#toolbar=1&navpanes=0&view=FitH';
  download.href=pdfUrl;download.download=`Formulario_709_${payload.year}_${caseData.id}.pdf`;
  openPdf.href=pdfUrl+'#toolbar=1&navpanes=0&view=FitH';
  frameWrap.hidden=false;download.hidden=false;openPdf.hidden=false;
  statusEl.textContent='Formulario generado correctamente. Revisa las páginas y descárgalo cuando lo necesites.';
 }catch(err){statusEl.textContent=err.message||'Ocurrió un error al generar el formulario.';}
}
window.addEventListener('beforeunload',()=>{if(pdfUrl)URL.revokeObjectURL(pdfUrl);});
build();
</script>
</body>
</html>
